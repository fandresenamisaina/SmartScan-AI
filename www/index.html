<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SmartScan AI</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Écran d'accueil : liste des documents -->
  <div id="home-screen" class="screen active">
    <header class="app-bar">
      <h1>SmartScan AI</h1>
    </header>

    <div class="search-bar">
      <input type="text" id="search-input" placeholder="Rechercher un document..." />
    </div>

    <div id="document-list" class="document-list">
      
    </div><p class="empty-state">Aucun document pour le moment.<br>Appuie sur « Scanner » en bas pour commencer.</p>

    <button id="scan-button" class="fab">📷 Scanner</button>
  </div>

  <!-- Écran de résultat : image + texte OCR -->
  <div id="result-screen" class="screen">
    <header class="app-bar">
      <button id="back-button" class="icon-button">←</button>
      <input type="text" id="title-input" placeholder="Titre du document" value="Document sans titre" />
      <button id="save-button" class="icon-button">✔</button>
    </header>

    <div class="result-body">
      <img id="result-image" src="" alt="Document scanné" />

      <div class="text-header">
        <strong>Texte détecté</strong>
        <div class="text-actions">
          <button id="copy-button" class="icon-button" title="Copier">📋</button>
          <button id="share-button" class="icon-button" title="Partager">📤</button>
        </div>
      </div>

      <div id="ocr-loading" class="loading">Analyse du texte en cours...</div>
      <pre id="extracted-text" class="extracted-text" style="display:none;"></pre>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>

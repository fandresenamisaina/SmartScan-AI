workflows:
  android-workflow:
    name: SmartScan AI - Android
    max_build_duration: 30
    environment:
      node: 22
      java: 17
    scripts:
      - name: Installer les dépendances npm
        script: npm install
      - name: Synchroniser Capacitor
        script: npx cap sync android
      - name: Compiler l'APK (debug)
        script: |
          cd android
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk